<h2>One Day</h2>

<p>
One day there will be no screens.  
No goodbyes after calls.  
Just you next to me.  
Simple mornings together.  
Real hugs instead of emojis.  
Until then we keep going.  
Slow, patient, real.  
I believe in that day.  
I believe in us.  
Always.
</p>
