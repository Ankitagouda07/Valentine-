<h2>My Promises</h2>

<p>
I promise to stay honest with you.  
To listen before getting angry.  
To respect your heart.  
To protect what we have.  
To not let distance make me lazy.  
To love you on boring days too.  
To choose us during storms.  
To grow with you.  
Not perfect, just real.  
Always yours.
</p>
